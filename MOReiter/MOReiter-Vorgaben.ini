; MOReiter-Vorgaben.ini - Voreinstellungen der Praxis fuer MOReiter
;
; Liegt neben MOReiter.exe (in der Praxis verteilt NVerb sie nach %APPDATA%\MOReiter). Jeder Wert
; gilt nur, wenn die eigene %APPDATA%\MOReiter\MOReiter.ini des Benutzers ihn nicht angibt; dorthin
; schreiben auch die Kalibrier-Hotkeys (Strg+Alt+Umsch+...), so dass eine neu verteilte Vorgaben-
; Datei keine Kalibrierung am einzelnen PC ueberschreibt. Beide Dateien haben denselben Aufbau.
;
; Zeilen mit ; am Anfang sind Kommentare. Auskommentierte Schluessel zeigen den eingebauten
; Standardwert; zum Aendern das ; entfernen und den Wert anpassen. Fehlt ein Schluessel, gilt
; der Standardwert. Aenderungen wirken sofort beim naechsten Hotkey, ein Neustart ist nicht noetig.
; Pixelangaben sind relativ zur linken oberen Ecke des jeweiligen Controls, Zeiten in Millisekunden.

[Allgemein]
; Control der Reiterleiste (Krankenblatt, Kartei, ePA, ePAAbr) in AutoIt-Schreibweise
;Control=[CLASS:TmoTabSet; INSTANCE:1]
; 1 = mit der echten Maus klicken (und den Mauszeiger danach zurueckstellen), 0 = unsichtbar per
; Nachricht ans Control. Nur noetig, falls ein Control auf die Nachricht nicht reagiert.
; Gilt fuer Reiter, Filter, Strg+Alt+Z, Strg+Alt+Leertaste und die Knoepfe "Hochladen"/"Uebernehmen".
; (Abhaken, der ePA-Pfeil und Alt+Pfeil in der Tagesuebersicht klicken immer mit der echten Maus.)
;EchteMaus=0
; Hintergrundfarbe eines aktiven Reiters (hellblau); daran erkennen Strg+Alt+K und Strg+Alt+P,
; ob schon Kartei bzw. ePA aktiv ist und zum anderen Reiter gewechselt werden soll
;AktivFarbe=0xD2E2F7
; erlaubte Abweichung von AktivFarbe je Farbanteil (0-255)
;Toleranz=12
; so viele ms Strg+Alt halten, bis gelbe Schildchen an allen Stellen des aktiven Fensters erscheinen,
; auf die eine Taste wirken wuerde (Reiter, Filter mit Nummer fuer den Ziffernblock ab 0 und direkter
; Taste, Diagnose-Kurzwahlen, Hochladen, Abhaken, Alt+Pfeil, Briefversand); 0 = nie
;Einblendung=500
; Ziffernfolge ohne Ziffernblock (Strg+Alt halten, z.B. 1 7 = Nr. 17): laengste Pause zwischen
; zwei Ziffern in ms, danach beginnt eine neue Folge
;FolgeZeit=2000
; pdftotext.exe (Xpdf-Werkzeuge, xpdfreader.com): liest beim Ablegen eines Berichts dessen Zeitraum aus dem PDF
; ({von}, {bis} in Name=); fehlt es, gilt der Zeitraum, den das Benutzerskript gemeldet hat
PdfText=v:\neu\pdftotext.exe
; Strg+Z liest die Markierungen aus der Datenbank von Medical Office (medoff, MySQL ODBC 8.0 Unicode Driver);
; Benutzer und Kennwort aus dieser Datei von Dateilese ([medoff] uid=, pwd=), Server wie bei Dateilese aus
; HKCU\Software\GSProducts\Dateilese MOServer (sonst wser), ersatzweise MORes (sonst wres)
;Zugang=C:\Program Files (x86)\Dateilesen\Zugang.ini
;MOPort=2020

; Position der Reiter in der Reiterleiste, kalibriert mit
; Strg+Alt+Umsch+K / L / P / A (Maus auf den Reiter halten)
[Krankenblatt]
; Standard: X=117, Y=9
X=48
Y=10

[Kartei]
; Standard: X=53, Y=10
X=122
Y=10

[ePA]
; Standard: X=164, Y=14
X=164
Y=14

[ePAAbr]
; Standard: X=212, Y=10
X=212
Y=10

[Filter]
; Filterliste links in der Kartei fuer Strg+Alt+^ 1 2 ... F12
; Reiter, auf dem die Filterliste liegt (wird bei Bedarf zuerst gewaehlt)
;Reiter=Kartei
; Mitte des 1. Filters ("Alle Eintraege") relativ zur Reiterleiste, kalibriert mit Strg+Alt+Umsch+^
;X=46
;Y=83
; Zeilenabstand der Filter, kalibriert mit Strg+Alt+Umsch+<andere Filtertaste>, darf Nachkommastellen haben
;Abstand=29
; Wartezeit nach dem Reiterwechsel, bis die Filterliste steht
;Warten=400

[Diagnosen]
; Strg+Alt+^ 1 2 ... F12 in der Diagnoseerfassung: 1., 2., ... 24. Diagnose-Kurzwahl rechts
; Spalten = erst die linke Spalte von oben nach unten, dann die naechste; Zeilen = zeilenweise
;Reihenfolge=Spalten
; Farbe der Kurzwahl-Knoepfe (daran werden sie erkannt) und erlaubte Abweichung je Farbanteil
;KnopfFarbe=0xB6B6B6
;Toleranz=6

[Tagesuebersicht]
; Strg+Alt+A in der MO-Tagesuebersicht (markierte Zeile als erledigt abhaken)
; Spalte "Bereich", auf die geklickt wird, kalibriert mit Strg+Alt+Umsch+A (Maus auf die Spalte halten)
; Standard: 470
BereichX=532
; Spalte, in die zum Markieren der nachrueckenden Zeile geklickt wird (Name)
;NameX=150
; Wartezeit nach "erledigt", bis die Zeile verschwunden ist und die naechste nachgerueckt ist
;Warten=500
; Alt+Pfeil hoch/runter: Farbe des gelben Rahmens um den gewaehlten Eintrag der Bereichsauswahl links
;BereichRahmen=0x8F8F1E
; so lange wird nach dem Klick links gewartet, bis sich die Liste rechts neu aufgebaut hat, dann wird
; ihre oberste Zeile angeklickt
;BereichWarten=1500

[Briefversand]
; Strg+Alt+B / M / F im Fenster "MEDICAL OFFICE - Briefversand": Betreff-Zeile, oberster Empfaenger,
; Brief-Vorschau. Ohne Angabe wird das Control nach seiner Klasse vermutet; trifft das nicht, hier das
; richtige in AutoIt-Schreibweise eintragen (Strg+Alt+Umsch+D listet alle Controls des Fensters), z.B.
;Betreff=[CLASS:TEdit; INSTANCE:1]
;Empfaenger=[CLASS:TStringGrid; INSTANCE:1]
;Vorschau=[CLASS:TPaintBox; INSTANCE:1]
; Strg+Alt+V: so lange (ms) nach dem ersten Klick auf "Versenden/Drucken" warten; steht der Briefversand dann
; noch unveraendert vorn, ein zweiter Klick
;ZweitKlick=800
; Klickpunkt fuer den obersten Empfaenger relativ zur linken oberen Ecke der Empfaengerliste
;EmpfaengerX=150
;EmpfaengerY=33

[Hochladen]
; Strg+Alt+H: Pfeil in der markierten Krankenblatt-Zeile, danach "Hochladen" im ePA-Fenster
; und gegebenenfalls "Uebernehmen" im folgenden Leistungsdialog
; Wartezeit, nachdem der Knopf sichtbar und bedienbar ist, bis er gedrueckt wird
; (gilt fuer "Hochladen" und "Uebernehmen"; bei ausgelassenen Klicks erhoehen)
;Warten=300
; so lange wird nach dem Schliessen des ePA-Fensters auf den Leistungsdialog gewartet
;LeistungWarten=1500

[Karteikarte]
; Strg+Alt+U: Fokus = nur den Tastaturfokus in die Liste setzen, Klick = in die markierte Zeile klicken
;Art=Fokus

[Termine]
; Strg+Alt+T: Wartezeit zwischen F6 und Alt+T bzw. nach dem zweiten F6
;Warten=200

[Labor]
; Strg+Alt+B (Zusatzfunktion, Beispiel Labor Staber): ohne Url ist sie abgeschaltet. Die Arbeit auf
; der Webseite macht das Benutzerskript MOReiter-Labor.user.js im Firefox-Add-on Tampermonkey; fuer
; ein anderes Labor braeuchte es ein eigenes Skript.
Url=https://onlinebefunde.labor-staber.de/onlinebefunde/index.php?func=patienten&cache=delete
; Seitentitel des Portals, daran wird der passende Firefox-Tab erkannt
;Titel=Onlinebefunde
; Benutzerkennung, falls Firefox sie nicht selbst eintraegt (besser nur in der eigenen MOReiter.ini)
;Kennung=
; Installationsadresse des Benutzerskripts, wird geoeffnet, wenn es nicht antwortet
;Skript=https://raw.githubusercontent.com/libelle17/vb6wurzel/main/MOReiter/MOReiter-Labor.user.js
; fehlt Tampermonkey im Firefox, wird das hier zur Installation geoeffnet (Pfad zur .xpi oder Adresse;
; ohne Angabe die Seite bei addons.mozilla.org); Firefox fragt vor dem Hinzufuegen nach
AddOn=v:\neu\tampermonkey-5.5.0.xpi
; einen danach heruntergeladenen Befund des Patienten (Befund_VornameNachname_<heute>_Labornummer.pdf)
; aus dem Download-Ordner hierher verschieben (bis 30 Minuten nach dem Aufruf)
Ablage=p:\
Datei=Befund_{vor}{nach}_{TT}{MM}{JJJJ}_\d{10}\.pdf
; Hoechstdauer in ms und Zahl der Firefox-Tabs, die von rechts her nach dem Portal durchsucht werden
;Zeit=30000
;Tabs=5
; Laborbefunde nicht wie die Zuckerberichte einordnen, s. [Dokumente]
Einordnen=0

[Aufrufe]
; Strg+Buchstabe bzw. Strg+Umsch+Buchstabe in jedem Fenster von Medical Office (nicht in Eingabefeldern,
; dort bleibt z.B. Strg+A "alles markieren"): Befehlszeile des Programms; {pat} wird zu
; "Nachname;Vorname;TT.MM.JJJJ" des geoeffneten Patienten (Dateilese und FCAufruf suchen damit die
; Patientennummer in Medical Office, statt sie aus c:\gdt\turbcust.gdt zu lesen)
Strg+P="C:\Program Files (x86)\Dateilesen\Dateilese.exe" plz {pat}
Strg+Umsch+P="C:\Program Files (x86)\Dateilesen\Dateilese.exe" nplz {pat}
Strg+A="C:\Program Files (x86)\Dateilesen\Dateilese.exe" ab {pat}
Strg+I="C:\Program Files (x86)\FCAufruf.exe" {pat}
; Accu-Chek Smart Pix Software: Patient in der Patientenliste suchen und waehlen, s. [SmartPix]
Strg+S=SmartPix
; ganze Patientenliste von Smart Pix lesen, mit Medical Office und quelle abgleichen, Geburtsdaten nachtragen,
; s. [SmartPixListe]
Strg+Umsch+S=SmartPixListe
; Portal im Firefox mit eigenem Benutzerskript (Abschnitt gleichen Namens, s.u.)
Strg+L=Portal:LibreView
Strg+D=Portal:Dexcom
Strg+G=Portal:Glooko
Strg+Y=Portal:YourLoops
Strg+E=Portal:EasyView
; alle Benutzerskripte (Portale mit Url=) in Tampermonkey einrichten bzw. aktualisieren
Strg+Umsch+T=Skripte
; alle Portale bzw. Programme nach den Zucker-Markierungen des Patienten, s. [Zucker]
Strg+Z=Zucker
; 1 = jede dieser Tasten mit Fokus und Entscheidung nach %APPDATA%\MOReiter\Aufrufe.log (zur Fehlersuche,
; am besten nur in der eigenen MOReiter.ini)
;Protokoll=1

[Zucker]
; Strg+Z: Markierungen des Patienten in Medical Office (Datenbank, Zugangsdaten aus der Zugang.ini von
; Dateilese, s. [Allgemein] Zugang=); fuer jede Markierung, deren Text den Schluessel enthaelt (ohne Ruecksicht
; auf Gross/Klein, erster passender Schluessel von oben, die eigene MOReiter.ini geht vor), wird der Befehl
; ausgefuehrt: Portal:Abschnitt, eine Befehlszeile wie in [Aufrufe] oder eine Taste aus [Aufrufe] (z.B. Strg+S);
; mehrere Markierungen nacheinander, jeder Befehl nur einmal; leerer Befehl = bekannt, aber kein Abruf
Libre=Portal:LibreView
Dexcom=Portal:Dexcom
Glooko=Portal:Glooko
Yourloops=Portal:YourLoops
Easy View=Portal:EasyView
Novopen=SmartPix
Spirit Combo=SmartPix
Medtronic=
Eversense=
Omnipod Dash=
Dana=

[Dokumente]
; Einordnen=1: ein abgerufenes PDF (Ablage= des Portals) gleich wie mit DokimpKurz weiter einordnen: Sicherheits-
; kopie nach Eingelesen=\Jahr (Jahr des Berichtsendes), Eintrag in quelle (tmbrie, dokprotlist, dokprotinh,
; dokprotvz; Mitarbeiter und Autor = PC-Name) und nach Dok=\Pat_id verschieben; die Patientennummer kommt vom
; Laufzettel-Link oder aus Medical Office (Name und Geburtsdatum muessen eindeutig sein), sonst bleibt die Datei
; mit einer Meldung in der Ablage; ein Abschnitt kann es mit eigenem Einordnen= anders halten (s. [Labor])
Einordnen=1
Eingelesen=p:\eingelesen
Dok=p:\dok

[SmartPix]
; Strg+S: startet das Programm (oder holt es nach vorn), klickt "Patientenliste oeffnen", sucht nach dem
; Geburtsdatum und waehlt den Patienten per Doppelklick, wenn genau einer uebrig bleibt; sonst bleibt die
; Liste (nach Geburtsdatum bzw. ersatzweise nach Nachname gefiltert) zum Waehlen stehen
;Programm=C:\AccuChek\SPIXSW\Accu-Chek Smart Pix Software.exe
; Klickstellen als x,y im Fensterinneren (ohne Titelleiste), negatives y = vom unteren Rand; bei anderer
; Bildschirmskalierung als 100 % entsprechend anpassen: Knopf "Patientenliste oeffnen" im Hauptfenster,
; Feld "Suchen" und erste Zeile (Spalte Nachname) in der Patientenliste
;Knopf=256,20
;Suche=357,-76
;Zeile=60,88
; s auf die Patientenliste warten, ms nach dem Tippen bis die Liste gefiltert ist
;Warten=30
;SuchWarten=1500
; zweites Strg+S nach einer Suche nach dem Nachnamen: Knopf "Patientendaten bearbeiten..." in der Liste, ms bis
; der Dialog bereit ist, Knopf "OK" im Dialog (leer = Enter)
;Bearbeiten=849,-76
; Knopf "Neuer Patient..." in der Liste: Strg+S legt den Patienten an, wenn weder Geburtsdatum noch Nachname passen
;Neu=710,-76
; angelegt wird auch, wenn alle mit dem Nachnamen ein Geburtsdatum haben: Spalte Geburtsdatum (x von,bis) und
; Zeilenhoehe in der Patientenliste
;GebSpalte=370,455
;Zeilenhoehe=28
;DialogWarten=500
; so lange (ms) auf den Dialog "Patientendaten bearbeiten" warten
;DialogMax=30000
; so lange (ms) warten, wenn Smart Pix "Keine Rueckmeldung" zeigt
;HaengtMax=300000
;OK=
; Strg+Umsch+S: Feld "Dateiname" im Dialog (x,y im Dialoginneren), daraus das letzte Auslesen laut palist.xml
;Dateiname=300,318

[SmartPixListe]
; Strg+Umsch+S: Probelauf (Ja) liest jeden Patienten ueber "Patientendaten bearbeiten" und schreibt Nachname,
; Vorname, Geburtsdatum, Patienten-ID mit dem Abgleich gegen Medical Office und quelle (Verstorbene mit "zzz"
; vorm Nachnamen zaehlen mit) und Vorschlaegen fuer fehlende Geburtsdaten und Patienten-IDs (Patientennummer)
; nach Datei=; Eintragen (Nein)
; uebernimmt die Vorschlaege der Zeilen mit Eintragen=j aus dieser Datei; Abbruch mit Esc
;Datei=C:\Users\...\Documents\SmartPix-Patienten.csv
; hoechstens so viele Patienten (0 = alle), zum Ausprobieren z.B. 30
;Max=0
; zum naechsten Patienten: MOReiter sucht in der Spalte Nachname (KanteX Pixel rechts von Zeile=) die dunkle
; Unterkante der Markierung (Farbe Kante=), klickt knapp darueber und drueckt Pfeil runter; mit ZurTabelle=
; stattdessen diese Tasten (z.B. {TAB}) und Pfeil runter
;KanteX=40
;Kante=0x0DA69E
;ZurTabelle=
; ms nach Pfeil runter; ms nach dem Leeren der Suche; so oft dieselben Daten = Ende der Liste
;Pause=200
;ListeWarten=5000
;Gleich=30
; bei "Kein Schreibzugriff" nach jedem dritten Versuch Smart Pix neu starten, so oft beim selben Patienten, dann Abbruch
;Neustarts=5
; nach dem Schliessen eines Patienten so lange (ms) warten, bis Smart Pix seine Sperre in palock.xml freigegeben hat (0 = nicht)
;FreiWarten=5000
; danach noch so viele ms warten (0 = nicht)
;Nachlauf=1000
; nach dem Speichern so lange (ms) warten, bis Smart Pix palist.xml neu geschrieben hat, sonst gilt es als nicht gespeichert (0 = nicht pruefen)
;Pruefen=10000
; die Liste ueber ihre Zellen lesen (Strg+C, Pfeiltasten), Patienten nur zum Eintragen oeffnen (0 = jeden oeffnen wie frueher)
;Zellen=1
; Spalten (ab 0) von Nachname, Vorname, Geburtsdatum, Patienten-ID, Letztes Auslesen
;Spalten=0,1,2,3,6
; so viele ms auf die kopierte Zelle warten, dann Strg+C noch einmal (hoechstens dreimal); ms nach Pfeil runter; so oft dieselbe Zeile = Ende der Liste
;Kopieren=300
;ZeilePause=30
; ms nach Pfeil rechts; ms vor dem zweiten Kopieren einer leer gelesenen Zelle
;ZellePause=50
;LeerPause=250
;GleichZeilen=10
; Ablaufprotokoll ohne Namen nach %APPDATA%\MOReiter\SmartPixListe.log (0 = keins)
;Protokoll=1
; Patienten nicht vorschlagen, deren erster Fall mehr als so viele Monate nach dem ersten Auslesen begann (0 = ohne)
;Vorlauf=3
; Geburtsdatum mit zweistelligem Jahr: 19.. und 20.. pruefen, bis zu diesem Alter
;HoechstAlter=125
; quelle: Zugangsdaten [quelle] uid=, pwd= in der Zugang.ini wie [medoff]
;QuelleServer=linux1
; Patientenliste von Smart Pix mit dem letzten Auslesen je Tagebuch: vorgeschlagen werden nur Patienten, deren
; erster Behandlungsfall (medoff patfall, quelle faelle.bhfb) nicht nach dem letzten Auslesen begann; passen dann
; mehrere, bleibt der Eintrag ohne Eintragen=j und wird beim Eintragen uebergangen
;Palist=P:\Datenbanken\AccuChek\Diaries\palist.xml
;QuellePort=3306

[LibreView]
; Strg+L (ueber [Aufrufe]): Glukose-Berichte des Patienten in LibreView; die Arbeit auf der Seite macht
; das Benutzerskript MOReiter-LibreView.user.js (Tampermonkey). Es meldet sich mit den im Firefox
; gespeicherten Zugangsdaten an (hoechstens ein Versuch), fordert bei Bedarf den Zwei-Faktor-Code per
; E-Mail an und hakt "14 Tage merken" mit dem PC-Namen an; den Code tippt man selbst ein.
Url=https://www.libreview.com/dashboard
Titel=LibreView
; Benutzer fuer den Mitglieder-Login (sonst naehme Firefox den ersten gespeicherten); das Passwort
; kommt aus dem Firefox-Kennwortspeicher
Kennung=diabetologie@dachau-mail.de
; Hoechstdauer in ms ohne Zwei-Faktor-Anmeldung (mit ihr 5 Minuten mehr zum Eintippen des Codes);
; Suche und Laden der Glukosedaten brauchen bei LibreView laenger als beim Labor
Zeit=150000
; das PDF von "PDF drucken/speichern" (vom Skript gedrueckt) aus dem Download-Ordner hierher verschieben,
; nur wenn sein Name zu Datei= passt (regulaerer Ausdruck; {vor}, {nach} = Vor- und Nachname des Patienten,
; {TT}, {MM}, {JJJJ} = heutiges Datum, an dem heruntergeladen wird)
Ablage=p:\
Datei={vor}{nach}_{TT}-{MM}-{JJJJ}\.pdf
; beim Verschieben umbenennen ({geb} = Geburtsdatum, {von}-{bis} = Zeitraum des Berichts, entfaellt, wenn das
; Skript ihn nicht findet; {TT}.{MM}.{JJJJ} = heute)
Name={nach}, {vor}, {geb}, Libre {von}-{bis}, erst. {TT}.{MM}.{JJJJ}.pdf

[Dexcom]
; Strg+D (ueber [Aufrufe]): Dexcom Clarity (Praxisportal), Benutzerskript MOReiter-Dexcom.user.js; Anmeldung
; mit den im Firefox gespeicherten Daten (hoechstens ein Versuch), Patient ueber die Suche nach Name und
; Geburtsdatum. Auf den PCs in SpeichernAuf= "Bericht speichern oder drucken" mit Zeitraum Tage= (7, 14, 30,
; 90) und "Bericht speichern" (PDF), auf den anderen "Zu interaktiven Berichten wechseln".
Url=https://clarity.dexcom.eu/professional/patients
Titel=Dexcom Clarity
SpeichernAuf=anmww,anmmw,anmmo,anmmoo,anmh,wser,wres
Tage=30
Zeit=150000
; Benutzer fuer die Anmeldung, falls Firefox mehrere gespeichert hat (sonst nimmt es den ersten)
Kennung=GSchade
; heruntergeladenen Bericht verschieben (s. [LibreView]); Dexcom nennt ihn clarity_JJJJ-MM-TT_hhmmss.pdf,
; Firefox haengt bei schon vorhandener Datei "(1)" an; nur auf den PCs in SpeichernAuf= entsteht eine Datei
Ablage=p:\
Datei=clarity_\d{4}-\d\d-\d\d_\d{6}(?:\(\d+\))?\.pdf
Name={nach}, {vor}, {geb}, Dexcom {von}-{bis}, erst. {TT}.{MM}.{JJJJ}.pdf

[Glooko]
; Strg+G (ueber [Aufrufe]): Glooko (Praxis), Benutzerskript MOReiter-Glooko.user.js; Anmeldung mit den im
; Firefox gespeicherten Daten (hoechstens ein Versuch), Patient ueber die Suche nach Name und Geburtsdatum,
; "PDF-Bericht erstellen", "PDF erstellen"; das PDF laedt das Skript als VornameNachname_Glooko_TT-MM-JJJJ.pdf
; herunter, MOReiter verschiebt es nach Ablage=
Url=https://de-fr.my.glooko.com/patients?locale=de
Titel=LogbookWeb
Zeit=150000
; Benutzer fuer die Anmeldung, falls Firefox mehrere gespeichert hat (sonst nimmt es den ersten)
;Kennung=
Ablage=p:\
; Glooko nennt die Datei selbst glooko-1.pdf, glooko-2.pdf ... (Firefox haengt bei schon vorhandener "(1)" an);
; MOReiter benennt sie beim Verschieben nach Name=
Datei=(?:{vor}{nach}_Glooko_{TT}-{MM}-{JJJJ}|glooko(?:-\d+)?)(?:\(\d+\))?\.pdf
Name={nach}, {vor}, {geb}, Glooko {von}-{bis}, erst. {TT}.{MM}.{JJJJ}.pdf

[YourLoops]
; Strg+Y (ueber [Aufrufe]): YourLoops (Diabeloop, Praxis), Benutzerskript MOReiter-YourLoops.user.js; Cookie-
; Hinweis "Nein danke", "Verbinden", Anmeldung bei auth.diabeloop.com mit den im Firefox gespeicherten Daten
; (hoechstens ein Versuch); fragt Diabeloop nach dem Code aus der Mail, hakt das Skript "Dieses Geraet 30 Tage
; lang speichern" an und der Mensch tippt den Code. Dann Patient ueber die Suche nach Name und Geburtsdatum,
; "Download-Bericht" mit Zeitraum Tage= (7, 14, 28 oder 90), PDF, "Herunterladen"
Url=https://www.your-loops.com/login
Titel=YourLoops
Tage=90
Zeit=150000
; Benutzer fuer die Anmeldung, falls Firefox mehrere gespeichert hat (sonst nimmt es den ersten)
;Kennung=
Ablage=p:\
; YourLoops nennt den Bericht "JJJJ-MM-TT - NAME VORNAME - yourloops-report-<Kennung>.pdf" (bzw. nur
; "yourloops-report-<Kennung>.pdf"), Firefox haengt bei schon vorhandener Datei "(1)" an
Datei=(?:\d{4}-\d\d-\d\d - .+ - )?yourloops-report-[0-9a-z]+(?:\(\d+\))?\.pdf
Name={nach}, {vor}, {geb}, YourLoops {von}-{bis}, erst. {TT}.{MM}.{JJJJ}.pdf

[EasyView]
; Strg+E (ueber [Aufrufe]): Medtrum EasyView Pro, Benutzerskript MOReiter-EasyView.user.js; "NEW VERSION",
; Anmeldung mit den im Firefox gespeicherten Daten (hoechstens ein Versuch, "Remember Me"), Patient ueber die
; Suche nach dem Nachnamen (EasyView zeigt kein Geburtsdatum, nur das Alter), Dashboard mit Zeitraum Tage= (7,
; 14, 30 oder 90), "Print". Den Druckdialog von Firefox bedient MOReiter: "Speichern" klickt es nur, wenn
; Firefox zuletzt "Als PDF speichern" benutzt hat (sonst klickt man selbst), im Fenster "Speichern unter"
; traegt es Ablage= und Name= ein
Url=https://easyview.medtrum.eu/v3/
Titel=EasyView
Tage=90
Zeit=150000
;Kennung=diabetologie@dachau-mail.de
