; MOReiter-Vorgaben.ini - Voreinstellungen der Praxis fuer MOReiter
;
; Liegt neben MOReiter.exe (in der Praxis verteilt NVerb sie nach %APPDATA%\MOReiter). Jeder Wert
; gilt nur, wenn die eigene %APPDATA%\MOReiter\MOReiter.ini des Benutzers ihn nicht angibt; dorthin
; schreiben auch die Kalibrier-Hotkeys (Strg+Alt+Umsch+...), so dass eine neu verteilte Vorgaben-
; Datei keine Kalibrierung am einzelnen PC ueberschreibt. Beide Dateien haben denselben Aufbau.
;
; Zeilen mit ; am Anfang sind Kommentare. Auskommentierte Schluessel zeigen den eingebauten
; Standardwert; zum Aendern das ; entfernen und den Wert anpassen. Fehlt ein Schluessel, gilt
; der Standardwert. Aenderungen wirken sofort beim naechsten Hotkey, ein Neustart ist nicht noetig.
; Pixelangaben sind relativ zur linken oberen Ecke des jeweiligen Controls, Zeiten in Millisekunden.

[Allgemein]
; Control der Reiterleiste (Krankenblatt, Kartei, ePA, ePAAbr) in AutoIt-Schreibweise
;Control=[CLASS:TmoTabSet; INSTANCE:1]
; 1 = mit der echten Maus klicken (und den Mauszeiger danach zurueckstellen), 0 = unsichtbar per
; Nachricht ans Control. Nur noetig, falls ein Control auf die Nachricht nicht reagiert.
; Gilt fuer Reiter, Filter, Strg+Alt+Z, Strg+Alt+Leertaste und die Knoepfe "Hochladen"/"Uebernehmen".
; (Abhaken, der ePA-Pfeil und Alt+Pfeil in der Tagesuebersicht klicken immer mit der echten Maus.)
;EchteMaus=0
; Hintergrundfarbe eines aktiven Reiters (hellblau); daran erkennen Strg+Alt+K und Strg+Alt+P,
; ob schon Kartei bzw. ePA aktiv ist und zum anderen Reiter gewechselt werden soll
;AktivFarbe=0xD2E2F7
; erlaubte Abweichung von AktivFarbe je Farbanteil (0-255)
;Toleranz=12
; so viele ms Strg+Alt halten, bis gelbe Schildchen an allen Stellen des aktiven Fensters erscheinen,
; auf die eine Taste wirken wuerde (Reiter, Filter mit Nummer fuer den Ziffernblock ab 0 und direkter
; Taste, Diagnose-Kurzwahlen, Hochladen, Abhaken, Alt+Pfeil, Briefversand); 0 = nie
;Einblendung=500
; Ziffernfolge ohne Ziffernblock (Strg+Alt halten, z.B. 1 7 = Nr. 17): laengste Pause zwischen
; zwei Ziffern in ms, danach beginnt eine neue Folge
;FolgeZeit=2000

; Position der Reiter in der Reiterleiste, kalibriert mit
; Strg+Alt+Umsch+K / L / P / A (Maus auf den Reiter halten)
[Krankenblatt]
; Standard: X=117, Y=9
X=48
Y=10

[Kartei]
; Standard: X=53, Y=10
X=122
Y=10

[ePA]
; Standard: X=164, Y=14
X=164
Y=14

[ePAAbr]
; Standard: X=212, Y=10
X=212
Y=10

[Filter]
; Filterliste links in der Kartei fuer Strg+Alt+^ 1 2 ... F12
; Reiter, auf dem die Filterliste liegt (wird bei Bedarf zuerst gewaehlt)
;Reiter=Kartei
; Mitte des 1. Filters ("Alle Eintraege") relativ zur Reiterleiste, kalibriert mit Strg+Alt+Umsch+^
;X=46
;Y=83
; Zeilenabstand der Filter, kalibriert mit Strg+Alt+Umsch+<andere Filtertaste>, darf Nachkommastellen haben
;Abstand=29
; Wartezeit nach dem Reiterwechsel, bis die Filterliste steht
;Warten=400

[Diagnosen]
; Strg+Alt+^ 1 2 ... F12 in der Diagnoseerfassung: 1., 2., ... 24. Diagnose-Kurzwahl rechts
; Spalten = erst die linke Spalte von oben nach unten, dann die naechste; Zeilen = zeilenweise
;Reihenfolge=Spalten
; Farbe der Kurzwahl-Knoepfe (daran werden sie erkannt) und erlaubte Abweichung je Farbanteil
;KnopfFarbe=0xB6B6B6
;Toleranz=6

[Tagesuebersicht]
; Strg+Alt+A in der MO-Tagesuebersicht (markierte Zeile als erledigt abhaken)
; Spalte "Bereich", auf die geklickt wird, kalibriert mit Strg+Alt+Umsch+A (Maus auf die Spalte halten)
; Standard: 470
BereichX=532
; Spalte, in die zum Markieren der nachrueckenden Zeile geklickt wird (Name)
;NameX=150
; Wartezeit nach "erledigt", bis die Zeile verschwunden ist und die naechste nachgerueckt ist
;Warten=500
; Alt+Pfeil hoch/runter: Farbe des gelben Rahmens um den gewaehlten Eintrag der Bereichsauswahl links
;BereichRahmen=0x8F8F1E
; so lange wird nach dem Klick links gewartet, bis sich die Liste rechts neu aufgebaut hat, dann wird
; ihre oberste Zeile angeklickt
;BereichWarten=1500

[Briefversand]
; Strg+Alt+B / M / F im Fenster "MEDICAL OFFICE - Briefversand": Betreff-Zeile, oberster Empfaenger,
; Brief-Vorschau. Ohne Angabe wird das Control nach seiner Klasse vermutet; trifft das nicht, hier das
; richtige in AutoIt-Schreibweise eintragen (Strg+Alt+Umsch+D listet alle Controls des Fensters), z.B.
;Betreff=[CLASS:TEdit; INSTANCE:1]
;Empfaenger=[CLASS:TStringGrid; INSTANCE:1]
;Vorschau=[CLASS:TPaintBox; INSTANCE:1]
; Klickpunkt fuer den obersten Empfaenger relativ zur linken oberen Ecke der Empfaengerliste
;EmpfaengerX=150
;EmpfaengerY=33

[Hochladen]
; Strg+Alt+H: Pfeil in der markierten Krankenblatt-Zeile, danach "Hochladen" im ePA-Fenster
; und gegebenenfalls "Uebernehmen" im folgenden Leistungsdialog
; Wartezeit, nachdem der Knopf sichtbar und bedienbar ist, bis er gedrueckt wird
; (gilt fuer "Hochladen" und "Uebernehmen"; bei ausgelassenen Klicks erhoehen)
;Warten=300
; so lange wird nach dem Schliessen des ePA-Fensters auf den Leistungsdialog gewartet
;LeistungWarten=1500

[Karteikarte]
; Strg+Alt+U: Fokus = nur den Tastaturfokus in die Liste setzen, Klick = in die markierte Zeile klicken
;Art=Fokus

[Termine]
; Strg+Alt+T: Wartezeit zwischen F6 und Alt+T bzw. nach dem zweiten F6
;Warten=200

[Labor]
; Strg+Alt+B (Zusatzfunktion, Beispiel Labor Staber): ohne Url ist sie abgeschaltet. Die Arbeit auf
; der Webseite macht das Benutzerskript MOReiter-Labor.user.js im Firefox-Add-on Tampermonkey; fuer
; ein anderes Labor braeuchte es ein eigenes Skript.
Url=https://onlinebefunde.labor-staber.de/onlinebefunde/index.php?func=patienten&cache=delete
; Seitentitel des Portals, daran wird der passende Firefox-Tab erkannt
;Titel=Onlinebefunde
; Benutzerkennung, falls Firefox sie nicht selbst eintraegt (besser nur in der eigenen MOReiter.ini)
;Kennung=
; Installationsadresse des Benutzerskripts, wird geoeffnet, wenn es nicht antwortet
;Skript=https://raw.githubusercontent.com/libelle17/vb6wurzel/main/MOReiter/MOReiter-Labor.user.js
; Hoechstdauer in ms und Zahl der Firefox-Tabs, die von rechts her nach dem Portal durchsucht werden
;Zeit=30000
;Tabs=5
